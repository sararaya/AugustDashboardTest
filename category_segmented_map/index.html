<title>Dubai Neighborhoods Map — SAS VA Data-Driven Content</title>
<!--
  SAS Visual Analytics — Data-Driven Content   Dubai_Neighborhoods  v1
  ==================================================================
  A choropleth of Dubai's 31 named neighborhoods (Deira, Bur Dubai, Jumeirah,
  Al Barsha, Nad Al Sheba ...), built by merging the official Dubai Municipality
  communities into recognizable districts. Each ticket's GPS point is binned
  into its neighbourhood LIVE from the rows VA sends, so the colours reflect
  the current filters. No data columns are required - the geometry and the
  binning live entirely in this DDC. Points outside Dubai are ignored.

  Styling matches the UAE Emirate_Map DDC: same mint->teal ramp, outline,
  hover, selection, and tooltip treatment. Transparent background, no title.

  DATA ROLES  ("Variables" role)
  ------------------------------
    1. Latitude    MEASURE    GPS_LATITUDE   (aggregation Average)
    2. Longitude   MEASURE    GPS_LONGITUDE  (aggregation Average)
    3. Ticket id   CATEGORY   TICKET_NO  - required, forces VA to send DETAIL
                              ROWS (one point per ticket, not one aggregate)

  If your data already carries a NEIGHBORHOOD_E column you can instead assign
  it as the first category and skip the coordinates; the DDC will colour by the
  measure per neighbourhood name. (Auto-detected.)

  URL PARAMETERS
  --------------
    ?scale=q        colour scale: q (quantile, default) | lin (linear)
    ?labelTop=12    label the N busiest neighbourhoods (default 12; 0 = none)
    ?font=0         skip the Google Fonts request
    ?debug=1        show what VA sent and the per-neighbourhood tallies
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

    /* mint -> teal ramp, low to high (identical to Emirate_Map) */
    --r0:#123A34; --r1:#155E52; --r2:#0E8F76; --r3:#16B58F;
    --r4:#2BE0A6; --r5:#5EF0BE; --r6:#8CFAD2;
    --none:#0E211C;
    --ink:#EAF7F1; --muted:#84A89B;
    --ar:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:transparent;color:var(--ink);font-family:var(--ar);
       overflow:hidden;-webkit-font-smoothing:antialiased}
  #wrap{height:100%;width:100%;min-height:0;min-width:0;padding:4px;
        display:flex;flex-direction:column}
  #mapbox{flex:1 1 auto;position:relative;min-height:0;min-width:0}
  svg{width:100%;height:100%;display:block}
  path.em{stroke:#0A1613;stroke-width:1;cursor:pointer;
          transition:stroke-width .12s,opacity .12s,filter .12s}
  path.em:hover{stroke:var(--ink);stroke-width:1.6;filter:brightness(1.12)}
  path.em.sel{stroke:#8CFAD2;stroke-width:2}
  path.em.dim{opacity:.4}

  #tip{position:absolute;pointer-events:none;z-index:9;white-space:nowrap;
       background:rgba(6,26,21,.96);border:1px solid rgba(43,224,166,.4);
       color:var(--ink);font-size:12.5px;padding:8px 12px;border-radius:10px;
       opacity:0;transition:opacity .1s;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  #tip .t{font-weight:700}
  #tip .m{color:var(--muted);font-size:11.5px}
  #tip .m b{color:#2BE0A6;font-weight:700}

  #legend{flex:none;display:flex;align-items:center;gap:10px;padding:6px 8px 2px;
          font-size:12px;color:var(--muted)}
  #legend .grad{flex:1;height:8px;border-radius:99px;max-width:220px;
      background:linear-gradient(90deg,var(--r6),var(--r4),var(--r2),var(--r0))}
  #legend .lo{order:1} #legend .hi{order:3} #legend .grad{order:2}

  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:var(--muted);font-size:12.5px;text-align:center;padding:20px;pointer-events:none}
  #dbg{position:absolute;inset:0;overflow:auto;padding:10px 12px;z-index:20;
       font:11.5px/1.5 ui-monospace,Consolas,monospace;color:#CFEEE2;
       background:rgba(4,18,13,.97);direction:ltr;text-align:left}
  #dbg h4{margin:8px 0 4px;font-size:12px;color:#2BE0A6}
  #dbg table{border-collapse:collapse;margin:4px 0;width:100%}
  #dbg td,#dbg th{border:1px solid rgba(43,224,166,.25);padding:2px 6px;text-align:left}
  #dbg th{color:#2BE0A6;font-weight:600}
  #dbg .bad{color:#FF6B6B}
</style>
</head>

    t.setAttribute("pointer-events","none");
    t.setAttribute("style","paint-order:stroke;stroke:rgba(6,20,16,.85);stroke-width:3px");
    t.textContent=s; svg.appendChild(t);
  }
  function centroid(f){
    var big=f.rings[0],ba=0;
    f.rings.forEach(function(r){var a=Math.abs(polyArea(r));if(a>ba){ba=a;big=r;}});
    var cx=0,cy=0;big.forEach(function(p){cx+=p[0];cy+=p[1];});return [cx/big.length,cy/big.length];
  }
  function polyArea(r){var a=0;for(var i=0,j=r.length-1;i<r.length;j=i++){a+=(r[j][0]+r[i][0])*(r[j][1]-r[i][1]);}return a/2;}

  function render(){
    svg.innerHTML=""; buildScale();
    var anySel=Object.keys(SEL).length>0;
    var vals=FEATS.map(function(f){return f.c;}).filter(function(v){return v>0;});
    var mn=vals.length?Math.min.apply(null,vals):0, mx=vals.length?Math.max.apply(null,vals):0;

    FEATS.forEach(function(f,i){
      f.rings.forEach(function(ring){
        var p=document.createElementNS(NS,"path");
        p.setAttribute("d",pathD(ring)); p.setAttribute("fill",colorFor(f.c));
        p.setAttribute("class","em"+(SEL[i]?" sel":"")+(anySel&&!SEL[i]?" dim":""));
        p.setAttribute("data-i",i);
        p.addEventListener("mousemove",moveTip);
        p.addEventListener("mouseenter",function(ev){ showTip(f); hl(i,true); moveTip(ev); });
        p.addEventListener("mouseleave",function(){ tip.style.opacity=0; hl(i,false); });
        p.addEventListener("click",function(ev){ toggle(i, ev.ctrlKey||ev.metaKey||ev.shiftKey); });
        svg.appendChild(p);
      });
    });

    if(LABELTOP>0){
      FEATS.map(function(f,i){return {f:f,i:i};})
        .filter(function(o){return o.f.c>0;})
        .sort(function(a,b){return b.f.c-a.f.c;}).slice(0,LABELTOP)
        .forEach(function(o){ var c=centroid(o.f);
          addText(projX(c[0]),projY(c[1]),o.f.ar,"#EAF7F1",700,13); });
    }

    if(vals.length){ legend.style.display="flex";
      legend.querySelector(".lo").textContent="أقل ("+num(mn)+")";
      legend.querySelector(".hi").textContent="أعلى ("+num(mx)+")";
    } else legend.style.display="none";
    msg.style.display=FEATS.length?"none":"flex";
  }

  function hl(i,on){
    var paths=svg.querySelectorAll('path[data-i="'+i+'"]');
    if(SEL[i])return;
    [].forEach.call(paths,function(p){ p.setAttribute("stroke",on?"#EAF7F1":"#0A1613"); p.setAttribute("stroke-width",on?1.6:1); });
  }
  function showTip(f){
    var h='<div class="t">'+esc(f.ar)+" · "+esc(f.en)+"</div>";
    h+='<div class="m">عدد المخالفات: <b>'+num(f.c||0)+"</b></div>";
    tip.innerHTML=h; tip.style.opacity=1;
  }
  function moveTip(ev){
    var r=document.getElementById("mapbox").getBoundingClientRect();
    var x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;
    if(x+tip.offsetWidth>r.width)x=ev.clientX-r.left-tip.offsetWidth-14;
    if(y+tip.offsetHeight>r.height)y=ev.clientY-r.top-tip.offsetHeight-14;
    tip.style.left=x+"px";tip.style.top=y+"px";
  }
  function toggle(i,additive){
    if(!SELECTABLE)return;
    if(!additive){var only=SEL[i]&&Object.keys(SEL).length===1;SEL={};if(!only)SEL[i]=true;}
    else{if(SEL[i])delete SEL[i];else SEL[i]=true;}
    var sels=[];Object.keys(SEL).forEach(function(i){(FEATS[i]._rows||[]).forEach(function(ri){sels.push({row:ri});});});
    try{window.parent.postMessage({resultName:RESULT,selections:sels},"*");}catch(e){}
    render();
  }

  // ---- live binning: assign each ticket's GPS point to its neighbourhood ----
  function bin(m){
    var cols=m.columns||[], rows=m.data||[];
    // if a NEIGHBORHOOD name column is present, colour by measure per name
    var nameCol=-1, measCol=-1, la=-1, lo=-1;
    cols.forEach(function(c,i){
      var lbl=String(c.label||c.name||"").toLowerCase();
      if(nameCol<0 && /neighbou?rhood|neighbourhood|\u062d\u064a|\u0645\u0646\u0637\u0642\u0629/.test(lbl)) nameCol=i;
      if(la<0 && /lat/.test(lbl)) la=i;
      if(lo<0 && /lon|lng/.test(lbl)) lo=i;
      var u=String(c.usage||"").toLowerCase(),t=String(c.type||"").toLowerCase();
      if((u==="quantitative"||(!u&&t==="number"))&&measCol<0) measCol=i;
    });
    // range-sniff fallback for lat/long
    if((la<0||lo<0)&&rows.length){
      cols.forEach(function(_,i){var mn=Infinity,mx=-Infinity,ok=0;
        for(var k=0;k<Math.min(rows.length,200);k++){var v=+rows[k][i];if(!isNaN(v)){if(v<mn)mn=v;if(v>mx)mx=v;ok++;}}
        if(ok>=3){ if(la<0&&mn>=22&&mx<=27)la=i; else if(lo<0&&mn>=51&&mx<=57)lo=i; }});
    }

    FEATS.forEach(function(f){f.c=0;f._rows=[];});

    if(nameCol>=0 && measCol>=0 && la<0){
      // name + measure mode
      var byName={}; FEATS.forEach(function(f){byName[f.en.toLowerCase()]=f;});
      rows.forEach(function(r,ri){
        var f=byName[String(r[nameCol]).toLowerCase()]; if(!f)return;
        var v=+r[measCol]; if(!isNaN(v)){f.c+=v;f._rows.push(ri);}
      });
      DATA._mode="name"; DATA._placed=rows.length; return true;
    }

    if(la<0||lo<0) return false;   // no coords, no name -> keep baked
    var placed=0;
    rows.forEach(function(r,ri){
      var lat=+r[la],lon=+r[lo]; if(isNaN(lat)||isNaN(lon))return;
      if(lon<B[0]||lon>B[1]||lat<B[2]||lat>B[3])return;
      for(var i=0;i<FEATS.length;i++){ if(inFeat(lon,lat,FEATS[i])){ FEATS[i].c++; FEATS[i]._rows.push(ri); placed++; break; } }
    });
    DATA._mode="coords"; DATA._placed=placed; DATA._sent=rows.length; DATA._la=la; DATA._lo=lo;
    return true;
  }

  var BAKED=FEATS.map(function(f){return f.c;});
  function restoreBaked(){FEATS.forEach(function(f,i){f.c=BAKED[i];f._rows=[];});}

  function onMessage(ev){
    var m=ev.data;
    if(!m||typeof m!=="object"||!m.columns||!m.data)return;
    RESULT=m.resultName||RESULT;
    if(DEBUG){ bin(m); dbg(m); return; }
    SEL={};
    var ok=bin(m);
    if(!ok || (DATA._mode==="coords" && m.data.length<30)) restoreBaked();
    render();
  }
  function dbg(m){
    var d=document.getElementById("dbg");
    if(!d){d=document.createElement("div");d.id="dbg";document.body.appendChild(d);}
    var cols=m.columns||[],rows=m.data||[];
    var h="<h4>Dubai_Neighborhoods debug</h4>version: "+VERSION+
      "<br>rows VA sent: <b style='color:"+(rows.length>50?"#2BE0A6":"#FF6B6B")+"'>"+rows.length+"</b>"+
      "<br>mode: "+(DATA._mode||"?")+" &nbsp; placed: "+(DATA._placed||0)+"<br><br>columns:<br>";
    cols.forEach(function(c,i){h+=(i+1)+". "+(c.label||c.name)+" ["+(c.usage||"")+"] eg="+(rows[0]?rows[0][i]:"")+"<br>";});
    if(rows.length<=5) h+="<br><span class='bad'>Only "+rows.length+" rows. Raise this object's Data \u2192 max rows; TICKET_NO must be a plain category. Showing baked counts.</span>";
    h+="<h4>top neighbourhoods</h4><table><tr><th>#</th><th>neighbourhood</th><th>count</th></tr>";
    FEATS.slice().sort(function(a,b){return b.c-a.c;}).slice(0,15).forEach(function(f,i){
      h+="<tr><td>"+(i+1)+"</td><td>"+esc(f.en)+"</td><td>"+num(f.c)+"</td></tr>";});
    h+="</table>"; d.innerHTML=h;
  }

  window.addEventListener("message",onMessage,false);
  var pend=false;
  function onResize(){if(pend)return;pend=true;
    requestAnimationFrame(function(){pend=false;if(FEATS.length)render();});}
  if(window.ResizeObserver) new ResizeObserver(onResize).observe(document.documentElement);
  window.addEventListener("resize",onResize,false);

  /* standalone preview - shows baked counts */
  if(window.parent===window){ render(); }
})();
</script>
</body>
