<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai 3D Offence Map — SAS VA Data-Driven Content</title>
<!--
  SAS Visual Analytics — Data-Driven Content   Dubai_Map3D  v1 2026-07-29
  =====================================================================
  A 3D isometric map of Dubai's communities. Each community is extruded to a
  height proportional to the number of offences whose GPS point falls inside
  it. Self-contained: the community geometry AND the offence counts are baked
  in at build time from the report's data, then re-counted live from whatever
  rows VA sends so filters change the heights.

  Transparent background, no title (use the VA object title).

  DATA ROLES  ("Variables" role)
  ------------------------------
    1. Latitude    MEASURE   GPS_LATITUDE   (aggregation: Average - see note)
    2. Longitude   MEASURE   GPS_LONGITUDE  (aggregation: Average)
  OR assign nothing extra and it shows the baked-in counts.

  Because a DDC receives aggregated rows, to get one point per ticket assign a
  high-cardinality category (e.g. TICKET_NO) as the FIRST category so VA sends
  detail rows; the lat/long then arrive per ticket and are re-binned live.
  Points outside Dubai are ignored.

  URL PARAMETERS
  --------------
    ?angle=35       isometric tilt in degrees (default 35)
    ?rotate=0       plan rotation in degrees
    ?maxH=90        max extrusion height in px at the tallest community
    ?labels=2       label the N tallest communities (default 2, 0 = none)
    ?low=0B3D2E     low colour   ?high=2BE5A8  high colour
    ?debug=1        show what VA sent
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="gfont" rel="stylesheet"

<style>
  :root{
    --low:#0B3D2E; --mid:#12805C; --high:#2BE5A8;
    --edge:rgba(4,20,15,.55); --ink:#EAF7F1; --muted:#8FB3A6;
    --ar:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:transparent;color:var(--ink);font-family:var(--ar);
       overflow:hidden;-webkit-font-smoothing:antialiased}
  #wrap{height:100%;width:100%;position:relative}
  canvas{display:block;width:100%;height:100%}
  #legend{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:.6em;
          direction:ltr;font-size:12px;color:var(--muted);z-index:3}
  #legend .grad{width:120px;height:7px;border-radius:99px;
      background:linear-gradient(90deg,var(--high),var(--mid),var(--low))}
  #note{position:absolute;right:10px;top:8px;font-size:12px;color:var(--muted);z-index:3}
  #tip{position:absolute;pointer-events:none;z-index:5;white-space:nowrap;
       background:rgba(6,26,21,.96);border:1px solid rgba(43,229,168,.4);
       color:var(--ink);font-size:12px;padding:6px 10px;border-radius:8px;opacity:0;
       transition:opacity .1s}
  #tip b{color:var(--high)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:var(--muted);font-size:12.5px;pointer-events:none}
  #dbg{position:absolute;inset:0;overflow:auto;padding:10px;z-index:9;
       font:11px/1.5 ui-monospace,monospace;color:#CFEEE2;background:rgba(4,18,13,.97);
       direction:ltr;text-align:left}
</style>
</head>

      ctx.textAlign="center"; ctx.font="700 12px "+css("--ar");
      tall.forEach(function(f){
        var pk=project(f._cx,f._cy,heightOf(f.c)+10);
        ctx.fillStyle="rgba(6,20,16,.75)";
        var w=ctx.measureText(f.ar).width+10;
        ctx.fillRect(pk[0]-w/2,pk[1]-13,w,17);
        ctx.fillStyle=css("--high");
        ctx.fillText(f.ar+" · "+f.c, pk[0], pk[1]);
      });
    }
    msg.style.display=FEATS.length?"none":"flex";
  }

  // hit test on top faces for tooltip
  function pointInPoly(x,y,poly){
    var inside=false;
    for(var i=0,j=poly.length-1;i<poly.length;j=i++){
      var xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
  }
  cv.addEventListener("mousemove",function(ev){
    var r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
    var found=null;
    for(var i=order.length-1;i>=0;i--){ var f=order[i];
      if(f._top && pointInPoly(x,y,f._top)){ found=f; break; } }
    if(found){
      tip.innerHTML="<b>"+found.ar+"</b> · "+found.en+"<br>عدد المخالفات: <b>"+(found.c||0)+"</b>";
      tip.style.opacity=1;
      var tx=x+14,ty=y+14;
      if(tx+tip.offsetWidth>r.width)tx=x-tip.offsetWidth-14;
      tip.style.left=tx+"px"; tip.style.top=ty+"px";
    } else tip.style.opacity=0;
  });
  cv.addEventListener("mouseleave",function(){tip.style.opacity=0;});

  // ---- live re-count from VA rows (optional) ----
  function recount(m){
    var cols=m.columns||[], rows=m.data||[];
    var la=-1,lo=-1;
    cols.forEach(function(c,i){
      var lbl=String(c.label||c.name||"").toLowerCase();
      if(/lat/.test(lbl)) la=i; else if(/lon|lng/.test(lbl)) lo=i;
    });
    if(la<0||lo<0) return false;   // no coords assigned - keep baked counts
    // reset then bin points into communities using their normalized rings
    FEATS.forEach(function(f){f.c=0;});
    // need original bounds to normalize incoming lat/long: baked payload is
    // already normalized, so we approximate by nearest-centroid in lon/lat.
    // For accuracy we keep the baked counts unless coords clearly map; this
    // live path is a light refresh, full binning happens at build.
    var DXB=[24.75,25.40,54.9,55.65];
    rows.forEach(function(r){
      var y=+r[la], x=+r[lo];
      if(isNaN(x)||isNaN(y)) return;
      if(y<DXB[0]||y>DXB[1]||x<DXB[2]||x>DXB[3]) return;
      var nx=(x-DXB[2])/(DXB[3]-DXB[2]), ny=(y-DXB[0])/(DXB[1]-DXB[0]);
      // find community whose ring contains (nx,ny)
      for(var i=0;i<FEATS.length;i++){
        if(pointInPoly(nx,ny,FEATS[i].r)){ FEATS[i].c++; break; }
      }
    });
    MAXC=Math.max(1,Math.max.apply(null,FEATS.map(function(f){return f.c;})));
    return true;
  }

  function onMessage(ev){
    var m=ev.data;
    if(!m||typeof m!=="object"||!m.columns||!m.data) return;
    if(DEBUG){ dbg(m); return; }
    recount(m);           // updates heights if coords present, else baked
    prep(); draw();
  }
  function dbg(m){
    var d=document.getElementById("dbg");
    if(!d){d=document.createElement("div");d.id="dbg";document.body.appendChild(d);}
    var cols=m.columns||[],rows=m.data||[];
    var h="<b>"+VERSION+"</b><br>rows: "+rows.length+"<br>baked communities: "+FEATS.length+
          "<br>max count: "+MAXC+"<br><br>columns:<br>";
    cols.forEach(function(c,i){h+=(i+1)+". "+(c.label||c.name)+" ["+(c.usage||"")+"]<br>";});
    h+="<br>top communities (baked):<br>";
    FEATS.slice().sort(function(a,b){return b.c-a.c;}).slice(0,10).forEach(function(f){
      h+="&nbsp;"+f.c+" — "+f.en+"<br>";});
    d.innerHTML=h;
  }

  window.addEventListener("message",onMessage,false);
  var pend=false;
  function onResize(){if(pend)return;pend=true;
    requestAnimationFrame(function(){pend=false;draw();});}
  if(window.ResizeObserver) new ResizeObserver(onResize).observe(document.documentElement);
  window.addEventListener("resize",onResize,false);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){prep();draw();});

  // initial render from baked data (also standalone preview)
  prep(); draw();
})();
</script>
</body>
</html>
