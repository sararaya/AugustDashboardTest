<title>Dubai Offence Map — SAS VA Data-Driven Content</title>
<!--
  SAS Visual Analytics — Data-Driven Content   Dubai_Map  v1 2026-07-29
  ===================================================================
  A flat 2D choropleth of Dubai's 222 communities (official Dubai Municipality
  boundaries + names, baked in). Each ticket's GPS point is binned into its
  community LIVE from the rows VA sends, so the colours reflect the current
  filters. No data columns are added - all logic is in this DDC. Points that
  fall outside Dubai are ignored.

  Transparent background, no title (use the VA object title).

  DATA ROLES  ("Variables" role)
  ------------------------------
    1. Latitude    MEASURE    GPS_LATITUDE   (aggregation Average)
    2. Longitude   MEASURE    GPS_LONGITUDE  (aggregation Average)
    3. Ticket id   CATEGORY   TICKET_NO      (forces VA to send DETAIL ROWS -
                                              one point per ticket, not one
                                              aggregated centroid)

  The third role is essential: without a high-cardinality category VA sends a
  single averaged lat/long and the map cannot bin anything.

  URL PARAMETERS
  --------------
    ?scale=q        colour scale: q (quantile, default) | lin (linear)
    ?labelTop=0     label the N busiest communities (default 0)
    ?stroke=1       show community outlines (default 1)
    ?debug=1        show what VA sent and the top communities
-->

       direction:ltr;text-align:left}
</style>

  svg.addEventListener("mouseleave",function(){tip.style.opacity=0;});

  // click -> filter by the rows in that community
  svg.addEventListener("click",function(ev){
    var t=ev.target.closest("path.area"); if(!t||!SELECTABLE)return;
    var i=+t.getAttribute("data-i");
    var additive=ev.ctrlKey||ev.metaKey||ev.shiftKey;
    if(!additive){var only=SEL[i]&&Object.keys(SEL).length===1;SEL={};if(!only)SEL[i]=true;}
    else{if(SEL[i])delete SEL[i];else SEL[i]=true;}
    var sels=[];
    Object.keys(SEL).forEach(function(i){ (FEATS[i]._rows||[]).forEach(function(ri){sels.push({row:ri});}); });
    try{window.parent.postMessage({resultName:RESULT,selections:sels},"*");}catch(e){}
    render();
  });

  // ---- LIVE binning: assign each ticket's GPS point to its community ----
  function bin(m){
    var cols=m.columns||[], rows=m.data||[];
    var la=-1,lo=-1;
    cols.forEach(function(c,i){
      var lbl=String(c.label||c.name||"").toLowerCase();
      if(la<0 && /lat/.test(lbl)) la=i;
      else if(lo<0 && /lon|lng/.test(lbl)) lo=i;
    });
    if(la<0||lo<0) return false;   // no coords -> keep baked counts
    FEATS.forEach(function(f){f.c=0; f._rows=[];});
    var placed=0;
    rows.forEach(function(r,ri){
      var lat=+r[la], lon=+r[lo];
      if(isNaN(lat)||isNaN(lon)) return;
      if(lon<B[0]||lon>B[1]||lat<B[2]||lat>B[3]) return;   // outside Dubai bounds
      for(var i=0;i<FEATS.length;i++){
        if(inRing(lon,lat,FEATS[i].r)){ FEATS[i].c++; FEATS[i]._rows.push(ri); placed++; break; }
      }
    });
    DATA._placed=placed; DATA._sent=rows.length;
    return true;
  }

  function onMessage(ev){
    var m=ev.data;
    if(!m||typeof m!=="object"||!m.columns||!m.data) return;
    RESULT=m.resultName||RESULT;
    if(DEBUG){ bin(m); dbg(m); return; }
    SEL={};
    bin(m);
    render();
  }
  function dbg(m){
    var d=document.getElementById("dbg");
    if(!d){d=document.createElement("div");d.id="dbg";document.body.appendChild(d);}
    var cols=m.columns||[],rows=m.data||[];
    var h="<b>"+VERSION+"</b><br>rows sent: "+rows.length+
          "<br>points placed in Dubai: "+(DATA._placed||0)+
          "<br>bounds lon["+B[0].toFixed(3)+","+B[1].toFixed(3)+"] lat["+B[2].toFixed(3)+","+B[3].toFixed(3)+"]<br><br>columns:<br>";
    cols.forEach(function(c,i){h+=(i+1)+". "+(c.label||c.name)+" ["+(c.usage||"")+"] eg="+(rows[0]?rows[0][i]:"")+"<br>";});
    if((DATA._placed||0)===0)
      h+="<br><span style='color:#FF6B6B'>0 placed - check that GPS_LATITUDE / GPS_LONGITUDE are assigned as measures and TICKET_NO as a category so detail rows arrive.</span>";
    h+="<br>top communities:<br>";
    FEATS.slice().sort(function(a,b){return b.c-a.c;}).slice(0,10).forEach(function(f){h+="&nbsp;"+f.c+" — "+f.en+"<br>";});
    d.innerHTML=h;
  }

  window.addEventListener("message",onMessage,false);

  /* standalone preview - never runs inside VA. Uses the baked counts. */
  if(window.parent===window){ render(); }
})();
</script>
</body>
