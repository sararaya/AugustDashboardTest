<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Card — SAS VA Data-Driven Content</title>
<!--
  SAS Visual Analytics — Data-Driven Content     Driver_Card  v1 2026-07-29
  ========================================================================
  An introduction card for ONE driver. Pair it with a VA control (a text
  filter on Traffic No, or a list on the name) so the report narrows to a
  single driver; this DDC then renders that driver's details.

  Transparent background, RTL, no title of its own.

  DATA ROLES  ("Variables" role, in THIS order)
  ---------------------------------------------
    1. Name           CATEGORY   NAME_A
    2. Nationality    CATEGORY   CNT_description_A
    3. Gender         CATEGORY   GENDER   (accepts 1/2, M/F, or ذكر/أنثى)
    4. Age            MEASURE    AGE, or a BIRTH_DATE (a date is turned into
                                 an age automatically)
    5. Traffic No     CATEGORY   Traffic No -> shown as رقم الملف
    6. Occupation     CATEGORY   OCCUPATION_DESC
    7. Danger level   CATEGORY   DANGER_CATEGORY_DESC, or the 1-4 code

  Only ONE driver is expected. If several rows arrive (the filter did not
  narrow to one) the FIRST row is shown and a small note appears; use ?debug=1
  to see the whole result set.

  THE DANGER BADGE
  ----------------
  The mock shows four reference bubbles (low / medium / dangerous / highly
  dangerous); the card renders only the ONE matching this driver, coloured by
  level. Set ?levels= to remap wording, e.g.
     ?levels=low:منخفض|medium:متوسط|dangerous:خطر|highly dangerous:عالي الخطورة
  Numeric 1-4 also map to those four levels in order.

  URL PARAMETERS
  --------------
    ?levels=...      code:label pairs, | separated (see above)
    ?genderMap=1:ذكر|2:أنثى   remap gender codes to words
    ?size=15         base font size in px
    ?font=0          skip the Google Fonts request
    ?debug=1         show what VA sent
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfont" rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
  :root{
    --name:#F3FAF6; --label:#8FB3A6; --value:#EAF7F1; --accent:#2BE0A6;
    --size:15px;
    --ar:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    /* danger palette, low -> high */
    --lo-bg:rgba(23,150,110,.14);   --lo-line:#1F9D74;   --lo-tx:#43D6A2;
    --md-bg:rgba(180,150,40,.14);   --md-line:#B49628;   --md-tx:#E4C24A;
    --hi-bg:rgba(196,120,30,.15);   --hi-line:#C4781E;   --hi-tx:#E39A3A;
    --xh-bg:rgba(196,70,60,.15);    --xh-line:#C4463C;   --xh-tx:#E0625C;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:transparent;color:var(--value);font-family:var(--ar);
       overflow:hidden;-webkit-font-smoothing:antialiased}
  #card{height:100%;width:100%;min-height:0;min-width:0;padding:6px 8px;
        display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:right}

  .name{font-size:calc(var(--size) + 13px);font-weight:800;color:var(--name);
        line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;
        font-size:var(--size);color:var(--label);line-height:1.7}
  .meta .pair{white-space:nowrap}
  .meta .k{color:var(--label)}
  .meta .v{color:var(--value);font-weight:700}
  .meta .dot{color:rgba(143,179,166,.5);padding:0 4px}

  .badges{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
  .badge{display:inline-flex;align-items:center;justify-content:center;
         padding:7px 20px;border-radius:999px;font-size:var(--size);font-weight:700;
         border:1px solid;white-space:nowrap}
  .badge.lo{background:var(--lo-bg);border-color:var(--lo-line);color:var(--lo-tx)}
  .badge.md{background:var(--md-bg);border-color:var(--md-line);color:var(--md-tx)}
  .badge.hi{background:var(--hi-bg);border-color:var(--hi-line);color:var(--hi-tx)}
  .badge.xh{background:var(--xh-bg);border-color:var(--xh-line);color:var(--xh-tx)}

  #note{font-size:12px;color:rgba(143,179,166,.7)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:var(--label);font-size:13px;text-align:center;padding:20px;pointer-events:none}
  #dbg{position:absolute;inset:0;overflow:auto;padding:10px 12px;z-index:20;
       font:11.5px/1.5 ui-monospace,Consolas,monospace;color:#CFEEE2;
       background:rgba(4,18,13,.97);direction:ltr;text-align:left}
  #dbg h4{margin:8px 0 4px;font-size:12px;color:var(--accent)}
  #dbg table{border-collapse:collapse;margin:4px 0;width:100%}
  #dbg td,#dbg th{border:1px solid rgba(43,224,166,.25);padding:2px 6px;text-align:left}
  #dbg th{color:var(--accent);font-weight:600}
  #dbg .bad{color:#FF6B6B} #dbg .ok{color:var(--accent)}

  body.compact .name{font-size:calc(var(--size) + 6px)}
  body.compact #card{gap:8px}
</style>
</head>
<body>
<div id="card" style="display:none">
  <div class="name" id="name"></div>
  <div class="meta" id="meta"></div>
  <div class="badges" id="badges"></div>
  <div id="note"></div>
</div>
<div id="msg">في انتظار اختيار سائق…</div>

<script>
(function(){
  "use strict";
  var VERSION = "Driver_Card v1 2026-07-29";
  console.log("[" + VERSION + "]");

  var Q = {};
  location.search.replace(/^\?/,"").split("&").forEach(function(kv){
    if(!kv) return;
    var i = kv.indexOf("=");
    Q[decodeURIComponent(i<0?kv:kv.slice(0,i))] = i<0?"":decodeURIComponent(kv.slice(i+1).replace(/\+/g," "));
  });
  if (Q.font === "0"){ var g=document.getElementById("gfont"); if(g) g.remove(); }
  if (Q.size) document.documentElement.style.setProperty("--size", parseInt(Q.size,10)+"px");
  var DEBUG = Q.debug === "1";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function has(v){ return v!==null && v!==undefined && String(v).trim()!==""; }

  /* ---- gender: accept codes or words ---- */
  var GENDER = {"1":"ذكر","2":"أنثى","m":"ذكر","male":"ذكر","f":"أنثى","female":"أنثى",
                "ذكر":"ذكر","انثى":"أنثى","أنثى":"أنثى"};
  if (Q.genderMap) Q.genderMap.split("|").forEach(function(p){
    var kv=p.split(":"); if(kv.length===2) GENDER[kv[0].trim().toLowerCase()]=kv[1]; });
  function genderWord(v){
    if (!has(v)) return "";
    return GENDER[String(v).trim().toLowerCase()] || String(v);
  }

  /* ---- danger level -> {cls, label} ---- */
  var LEVELS = {
    "1":{cls:"lo",label:"منخفض"}, "low":{cls:"lo",label:"منخفض"}, "منخفض":{cls:"lo",label:"منخفض"},
    "2":{cls:"md",label:"متوسط"}, "medium":{cls:"md",label:"متوسط"}, "متوسط":{cls:"md",label:"متوسط"},
    "3":{cls:"hi",label:"خطر"},   "dangerous":{cls:"hi",label:"خطر"}, "خطر":{cls:"hi",label:"خطر"},
    "4":{cls:"xh",label:"عالي الخطورة"}, "highly dangerous":{cls:"xh",label:"عالي الخطورة"},
    "عالي الخطورة":{cls:"xh",label:"عالي الخطورة"}
  };
  // ?levels=code:label|... overrides only the wording, keeps the colour tier
  if (Q.levels) Q.levels.split("|").forEach(function(p){
    var idx=p.indexOf(":"); if(idx<0) return;
    var code=p.slice(0,idx).trim().toLowerCase(), lab=p.slice(idx+1);
    if (LEVELS[code]) LEVELS[code] = {cls:LEVELS[code].cls, label:lab};
  });
  function levelOf(v){
    if (!has(v)) return null;
    return LEVELS[String(v).trim().toLowerCase()] || {cls:"md", label:String(v)};
  }

  /* ---- age: a number stays, a date becomes an age ---- */
  function ageOf(v){
    if (!has(v)) return "";
    var n = Number(v);
    if (!isNaN(n) && n > 0 && n < 130) return String(Math.round(n));
    var d = new Date(v);
    if (!isNaN(d.getTime())){
      var t = new Date();
      var a = t.getFullYear() - d.getFullYear();
      if (t.getMonth() < d.getMonth() || (t.getMonth()===d.getMonth() && t.getDate()<d.getDate())) a--;
      if (a > 0 && a < 130) return String(a);
    }
    return "";
  }

  /* ---- split columns into categories and measures, keep order ---- */
  function classify(columns){
    return columns.map(function(c,i){
      var u = String(c.usage||"").toLowerCase(), t = String(c.type||"").toLowerCase();
      return { i:i, measure: (u==="quantitative" || (!u && t==="number")), label:c.label||c.name, type:t };
    });
  }

  /* Roles are positional (1..7). To be resilient to VA reordering
     categories vs measures, we walk the columns in order and fill the seven
     slots, treating age as the sole measure-or-date slot. */
  function readDriver(columns, row){
    // by strict position first
    var pos = {
      name: row[0], nat: row[1], gender: row[2], age: row[3],
      traffic: row[4], occ: row[5], danger: row[6]
    };
    return pos;
  }

  var msg = document.getElementById("msg"),
      card = document.getElementById("card");

  function render(columns, rows){
    if (!rows.length){ card.style.display="none"; msg.style.display="flex";
                       msg.textContent="لا يوجد سائق مطابق"; return; }
    msg.style.display="none"; card.style.display="flex";

    var d = readDriver(columns, rows[0]);

    document.getElementById("name").textContent = has(d.name) ? String(d.name) : "—";

    var bits = [];
    if (has(d.nat))    bits.push(['الجنسية', String(d.nat)]);
    var gw = genderWord(d.gender);        if (gw) bits.push(['الجنس', gw]);
    var ag = ageOf(d.age);                if (ag) bits.push(['العمر', ag]);
    if (has(d.traffic))bits.push(['رقم الملف', String(d.traffic)]);
    if (has(d.occ))    bits.push(['الوظيفة', String(d.occ)]);

    document.getElementById("meta").innerHTML = bits.map(function(b,i){
      return (i? '<span class="dot">·</span>' : "") +
        '<span class="pair"><span class="k">' + esc(b[0]) + ':</span> ' +
        '<span class="v">' + esc(b[1]) + "</span></span>";
    }).join("");

    var lvl = levelOf(d.danger);
    document.getElementById("badges").innerHTML = lvl
      ? '<span class="badge ' + lvl.cls + '">' + esc(lvl.label) + "</span>" : "";

    document.getElementById("note").textContent =
      rows.length > 1 ? "⚠ الفلتر لم يحصر النتيجة بسائق واحد (" + rows.length + " صفوف) — يعرض الأول" : "";

    document.body.classList.toggle("compact", document.documentElement.clientHeight < 150);
  }

  function debugDump(m){
    var d = document.getElementById("dbg");
    if(!d){ d=document.createElement("div"); d.id="dbg"; document.body.appendChild(d); }
    var cols=m.columns||[], rows=m.data||[];
    var h = "<h4>Driver_Card debug</h4>version: <b class='ok'>"+VERSION+"</b><br>";
    h += "rows: <b class='"+(rows.length===1?"ok":"bad")+"'>"+rows.length+"</b> "+
         (rows.length===1?"(one driver - good)":"(filter should narrow to ONE driver)")+"<br><br>";
    h += "<table><tr><th>slot</th><th>column</th><th>usage</th><th>row1</th></tr>";
    var slots=["1 name","2 nationality","3 gender","4 age/birth","5 traffic no","6 occupation","7 danger"];
    cols.forEach(function(c,i){
      h += "<tr><td>"+(slots[i]||("col "+(i+1)))+"</td><td>"+esc(c.label||c.name)+"</td><td>"+
           esc(c.usage||"")+"</td><td>"+esc(String(rows.length?rows[0][i]:""))+"</td></tr>";
    });
    h += "</table>";
    d.innerHTML = h;
  }

  function onMessage(ev){
    var m = ev.data;
    if (!m || typeof m!=="object" || !m.columns || !m.data) return;
    if (DEBUG){ debugDump(m); return; }
    render(m.columns, m.data);
  }
  window.addEventListener("message", onMessage, false);

  var pend=false;
  window.addEventListener("resize", function(){
    if(pend)return; pend=true;
    requestAnimationFrame(function(){ pend=false;
      document.body.classList.toggle("compact", document.documentElement.clientHeight < 150); });
  }, false);

  /* standalone preview - never runs inside VA */
  if (window.parent === window){
    onMessage({ data:{
      resultName:"preview",
      columns:[
        {name:"c1",label:"NAME_A",           type:"string",usage:"categorical"},
        {name:"c2",label:"CNT_description_A", type:"string",usage:"categorical"},
        {name:"c3",label:"GENDER",           type:"string",usage:"categorical"},
        {name:"m1",label:"AGE",              type:"number",usage:"quantitative"},
        {name:"c4",label:"Traffic No",       type:"string",usage:"categorical"},
        {name:"c5",label:"OCCUPATION_DESC",  type:"string",usage:"categorical"},
        {name:"c6",label:"DANGER_CATEGORY_DESC",type:"string",usage:"categorical"}
      ],
      data:[["محمد أحمد علي الكتبي","الإمارات","1",44,"5842107","سائق","highly dangerous"]]
    }});
  }
})();
</script>
</body>
</html>
