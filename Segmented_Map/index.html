<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAE Emirate Choropleth — SAS VA Data-Driven Content</title>
<!--
  SAS Visual Analytics — Data-Driven Content object
  ================================================
  UAE emirate choropleth. Self-contained: no external scripts, no CDN,
  no map service. Works offline inside the VA iframe.

  DATA ROLES (assign in this order in the "Variables" role of the DDC object)
  --------------------------------------------------------------------------
    1. Emirate         CATEGORY  (required)  e.g. PLC_EMI_CODE
    2. Frequency       MEASURE   (required)  drives the colour ramp
    3. Average fine    MEASURE   (optional)  shown in tooltip / side list
    4. Any 3rd measure MEASURE   (optional)  shown in tooltip

  The category may contain emirate CODES (DXB, AUH, SHJ, AJM, RAK, FUJ, UAQ),
  ENGLISH names (Dubai, Abu Dhabi, ...) or ARABIC names (دبي, أبوظبي, ...).
  All three are matched by the alias table below.

  Columns are matched by ROLE first (first category = key, first measure =
  colour) and fall back to positional order, so minor role re-ordering in VA
  will not break the object.

  Clicking an emirate posts a selection message back to VA, so this object
  participates in brushing/linked filtering like any native VA chart.
-->
<style>
  :root{
    --c0:#E6F2EA; --c1:#C2E0CE; --c2:#8FC7A6; --c3:#4DA574;
    --c4:#1E7A4C; --c5:#0B5B34; --c6:#063D22;
    --ink:#111412; --n1:#F4F5F4; --n2:#E4E6E4; --n4:#8A8E8A; --n5:#4B4F4B;
    --sel:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
       color:var(--ink);background:transparent;overflow:hidden}
  #wrap{display:flex;height:100vh;gap:14px;padding:10px}
  #side{width:38%;min-width:190px;max-width:340px;overflow:auto;display:flex;flex-direction:column}
  #mapbox{flex:1;position:relative;min-width:0}
  svg{width:100%;height:100%;display:block}
  path.em{stroke:#fff;stroke-width:1;cursor:pointer;transition:stroke-width .1s,opacity .1s}
  path.em:hover{stroke:var(--ink);stroke-width:2}
  path.em.sel{stroke:var(--sel);stroke-width:2.4}
  path.em.dim{opacity:.35}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;
       padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer;transition:background .1s}
  .row:hover,.row.hi{background:var(--c0)}
  .row.sel{background:#FBE9E7;box-shadow:inset 0 0 0 1px #E2574C}
  .row b{font-weight:700}
  .row .mn{color:var(--n4);font-size:11.5px;font-weight:400}
  .row .val{white-space:nowrap;text-align:left}
  #tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;
       padding:8px 11px;border-radius:9px;opacity:0;transition:opacity .1s;white-space:nowrap;
       z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.22)}
  #tip small{color:var(--c2)}
  #legend{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--n5);
          margin-top:auto;padding-top:10px;flex-wrap:wrap}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:var(--n4);font-size:13px;text-align:center;padding:20px}
  #clear{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--n2);
         background:#fff;color:var(--n5);cursor:pointer;display:none;margin-bottom:8px;align-self:flex-start}
  #clear:hover{border-color:var(--sel);color:var(--sel)}
  @media(max-width:620px){#wrap{flex-direction:column}#side{width:auto;max-width:none;max-height:40%}}
</style>
</head>
<body>

  <div id="side">
    <button id="clear" type="button">مسح التحديد · Clear</button>
    <div id="list"></div>
    <div id="legend"></div>
  </div>
  <div id="mapbox">

    <div id="tip"></div>

  </div>
</div>

    legend.innerHTML =
      '<span style="display:flex;align-items:center;gap:5px"><span class="sw" style="background:' + RAMP[0] + '"></span>' + fmtNum(mn) + "</span>" +
      '<span style="display:flex;align-items:center;gap:5px"><span class="sw" style="background:' + RAMP[3] + '"></span>' + STATE.labels.value + "</span>" +
      '<span style="display:flex;align-items:center;gap:5px"><span class="sw" style="background:' + RAMP[6] + '"></span>' + fmtNum(mx) + "</span>";

    clearBtn.style.display = anySel ? "block" : "none";
    msg.style.display = rows.length ? "none" : "flex";
  }

  function addText(x, y, s, size, fill, weight) {
    var t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y);
    t.setAttribute("font-size", size); t.setAttribute("fill", fill);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-family", "inherit");
    if (weight) t.setAttribute("font-weight", weight);
    t.setAttribute("pointer-events", "none");
    t.textContent = s;
    svg.appendChild(t);
  }

  function showTip(f, rec) {
    var html = "<b>" + f.ar + "</b> · " + f.en;
    if (rec) {
      html += "<br>" + STATE.labels.value + ": " + fmtNum(rec.v);
      rec.extra.forEach(function (e) { html += "<br><small>" + e.label + ": " + fmtNum(e.v) + "</small>"; });
    } else {
      html += "<br><small>لا توجد بيانات</small>";
    }
    tip.innerHTML = html;
    tip.style.opacity = 1;
  }
  function moveTip(ev) {
    var r = document.getElementById("mapbox").getBoundingClientRect();
    var x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width) x = ev.clientX - r.left - tip.offsetWidth - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function highlight(id, on) {
    var row = list.querySelector('.row[data-id="' + id + '"]');
    if (row) row.classList.toggle("hi", on);
    var p = STATE.paths[id];
    if (p && !STATE.sel[id]) {
      p.setAttribute("stroke", on ? "#111412" : "#fff");
      p.setAttribute("stroke-width", on ? 2 : 1);
    }
  }

  /* ----------------------------------------------------------------------
     Selection -> back to Visual Analytics (brushing / linked filtering)
     ---------------------------------------------------------------------- */
  function toggle(id, additive) {
    if (!id) return;
    if (!additive) {
      var only = STATE.sel[id] && Object.keys(STATE.sel).length === 1;
      STATE.sel = {};
      if (!only) STATE.sel[id] = true;
    } else {
      if (STATE.sel[id]) delete STATE.sel[id]; else STATE.sel[id] = true;
    }
    postSelection();
    render();
  }
  function postSelection() {
    if (!STATE.resultName) return;
    var sels = [];
    STATE.rows.forEach(function (r) { if (STATE.sel[r.id]) sels.push({ row: r.rowIndex }); });
    try {
      window.parent.postMessage({ resultName: STATE.resultName, selections: sels }, "*");
    } catch (e) { /* not embedded in VA */ }
  }
  clearBtn.addEventListener("click", function () { STATE.sel = {}; postSelection(); render(); });

  /* ----------------------------------------------------------------------
     Inbound message from Visual Analytics
     ---------------------------------------------------------------------- */
  function onMessage(ev) {
    var m = ev.data;
    if (!m || typeof m !== "object") return;
    if (!m.columns || !m.data) return;          // ignore unrelated postMessages

    STATE.resultName = m.resultName || STATE.resultName;

    var pick = pickColumns(m.columns);
    STATE.labels.category = labelOf(m.columns[pick.cat]);
    STATE.labels.value = labelOf(m.columns[pick.meas[0]]) || "القيمة";

    var unmatched = [];
    STATE.rows = m.data.map(function (row, i) {
      var raw = row[pick.cat];
      var id = resolve(raw);
      if (!id) unmatched.push(raw);
      return {
        rowIndex: i,
        raw: raw,
        id: id,
        v: Number(row[pick.meas[0]]),
        extra: pick.meas.slice(1).map(function (mi) {
          return { label: labelOf(m.columns[mi]), v: row[mi] };
        })
      };
    }).filter(function (r) { return r.id; });

    // reflect selections made elsewhere in the report
    STATE.sel = {};
    if (m.selections && m.selections.length) {
      m.selections.forEach(function (s) {
        var r = STATE.rows.filter(function (x) { return x.rowIndex === s.row; })[0];
        if (r) STATE.sel[r.id] = true;
      });
    }

    render();

    if (unmatched.length) {
      console.warn("[UAE DDC] category values not matched to an emirate:",
                   unmatched.slice(0, 10));
    }
  }
  window.addEventListener("message", onMessage, false);

  // Some VA versions wait for the content to announce itself.
  try { window.parent.postMessage({ resultName: "", message: "ddc-ready" }, "*"); } catch (e) {}

  /* ----------------------------------------------------------------------
     Standalone preview: if not embedded in VA, show sample data so the file
     can be opened directly in a browser to check rendering.
     ---------------------------------------------------------------------- */
  if (window.parent === window) {
    onMessage({ data: {
      resultName: "preview",
      columns: [
        { name: "bi1", label: "PLC_EMI_CODE",   type: "string", usage: "categorical" },
        { name: "bi2", label: "Frequency",      type: "number", usage: "quantitative" },
        { name: "bi3", label: "Average fine",   type: "number", usage: "quantitative" }
      ],
      data: [
        ["DXB", 687, 3693], ["AUH", 679, 3263], ["SHJ", 426, 3384],
        ["AJM", 215, 3069], ["RAK", 198, 3322], ["FUJ", 123, 5835], ["UAQ", 94, 3612]
      ]
    }});
  }
})();
</script>
